[package]
name = "multisig-glue"
version = "0.1.0"
edition = "2021"

[dependencies]
rec_aggregation = { git = "https://github.com/qdrvm/leanMultisig.git", rev = "b030a846798ab950fb711997120f05041650d88d" }
leansig_wrapper = { git = "https://github.com/qdrvm/leanMultisig.git", rev = "b030a846798ab950fb711997120f05041650d88d" }
backend = { git = "https://github.com/qdrvm/leanMultisig.git", rev = "b030a846798ab950fb711997120f05041650d88d" }

[lib]
# Built as an rlib so its `#[no_mangle] pub extern "C"` symbols can be funnelled
# through the `zeam-glue` staticlib shim. See blockblaz/zeam#773.
crate-type = ["rlib"]
name = "multisig_glue"
